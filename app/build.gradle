plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rk.tunnel'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ohli.tunel'
        minSdk 26
        targetSdk 28
        versionCode 6
        versionName '3.2.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
            keepDebugSymbols += ["**/libcloudflared.so"]
        }
    }
}
